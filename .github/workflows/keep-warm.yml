name: Keep Render warm

# Pings the live Render URL every 14 minutes so its free-tier instance never
# spins down (Render sleeps after 15 min idle). Also runnable manually from
# the Actions tab if you ever need to wake it on demand.

on:
  schedule:
    - cron: "*/14 * * * *"   # every 14 minutes
  workflow_dispatch:         # manual trigger button

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Curl landing page
        run: |
          echo "Pinging NTG Auction Cup..."
          curl -fsS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            "https://ntg-auc-cup-sg.onrender.com/" \
            || echo "WARN: ping failed (server cold-starting is OK on free tier)"
      - name: Curl public API
        run: |
          curl -fsS -o /dev/null -w "API HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 \
            "https://ntg-auc-cup-sg.onrender.com/api/public/" \
            || echo "WARN: API ping failed"
